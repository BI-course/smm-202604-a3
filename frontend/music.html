<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next-track recommender | Group A-3 ML</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Page-specific additions only; everything else comes from the shared style.css. */
  .result.empty { border-left: 4px solid #d97706; }
  .rec { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .rec:last-child { border-bottom: 0; }
</style>
</head>
<body>
<header>
  <h1>Next-track recommender</h1>
  <p>Association rules: what should this listener play next?</p>
  <nav><a href="index.html">Home</a><a href="rental.html">Rent</a><a href="attrition.html">Attrition</a><a href="stores.html">Stores</a><a href="music.html" class="active">Music</a></nav>
</header>
<main>
  <div class="card">
    <p class="muted">Tick the tracks played in this listening session, then ask for a recommendation.</p>
    <form id="form" novalidate>
      <div class="tracks" id="tracks"></div>
      <button type="submit">Recommend</button>
      <button type="button" class="secondary" id="clear">Clear</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </div>
</main>
<script src="app.js"></script>
<script src="music.js"></script>
</body>
</html>
